# Anaconda installer ISO configuration for Enthroned OS (F1).
# Adapted from image-template disk_config/iso-kde.toml (Apache-2.0).
#
# The %post hook points the installed system at the published Enthroned OS
# OCI image. The reference below is a DELIBERATE PLACEHOLDER: replace
# SET_ME_BEFORE_PUBLISH with the real ghcr.io namespace once ADR-0002
# configuration is done. verify-source.sh flags placeholder mismatches.

[customizations.installer.kickstart]
contents = """
%post
bootc switch --mutate-in-place --transport registry ghcr.io/SET_ME_BEFORE_PUBLISH/enthroned-os:f1-dev
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]

disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
