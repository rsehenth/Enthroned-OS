# Enthroned OS - Gate 16: keep the input-remapper daemon off the graphical
# boot wait. In the pinned Aurora base the "WantedBy=default.target" enable
# link makes systemd add the implicit "graphical.target After= wanted unit"
# edge, so the desktop waited for this Python daemon (H6 boot 2: +30.560 s,
# the last unit to finish before graphical.target @72.413 s; Gate 12.6: 27-45+
# s pre-ambulum under slow I/O and a busy udev queue).
#
# Restore the service's default startup and shutdown dependencies explicitly.
# graphical.target still starts the daemon without gating target readiness on
# its D-Bus name. Presets need the daemon to be ready when session autoload runs.
#
# SPDX-License-Identifier: Apache-2.0

[Unit]
DefaultDependencies=no
Requires=sysinit.target
After=sysinit.target basic.target
Before=shutdown.target
Conflicts=shutdown.target
