# Lote 10.2 (Gate 10.1): keep this Fedora Atomic desktops workaround out of
# the boot critical path (H4: ~55-70 s AppStream refresh gated
# multi-user.target, and therefore graphical.target). The unit is wanted by
# graphical.target (see build_files/build.sh); this explicit After= makes
# systemd suppress the implicit "target after wanted unit" ordering
# (unit_add_default_target_dependency), so the target never waits for the
# oneshot. Upstream commands, conditions and caches are untouched.
# SPDX-License-Identifier: Apache-2.0
[Unit]
After=graphical.target
