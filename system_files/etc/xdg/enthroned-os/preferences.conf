# Enthroned OS per-user product preferences (system defaults).
# Read with kreadconfig6 --file enthroned-os/preferences.conf and through
# Enthroned Settings (preference manager). A user's own
# ~/.config/enthroned-os/preferences.conf always wins.
#
# CreateDesktopShortcuts: when a user installs an application through a flow
# Enthroned actually integrates with (currently the optional ArtCraft install
# in Enthroned Welcome), a shortcut for that app is placed on the real user
# Desktop directory automatically. Installing updates of already-installed
# apps never creates or duplicates shortcuts, hidden/technical entries are
# refused, and Discover-installed apps keep the explicit "Adicionar a area de
# trabalho" action in the launcher menu (Discover provides no reliable
# install-finished signal, so nothing watches it).
#
# SPDX-License-Identifier: Apache-2.0

[General]
CreateDesktopShortcuts=true
