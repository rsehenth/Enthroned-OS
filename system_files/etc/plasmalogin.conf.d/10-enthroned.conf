# Enthroned OS login screen defaults (Plasma Login Manager).
# Overrides /usr/lib/plasmalogin/defaults.conf (Aurora wallpaper) while
# preserving /etc/plasmalogin.conf for user customization.

[Greeter]
WallpaperPlugin=org.kde.image

[Greeter][Wallpaper][org.kde.image][General]
Image=file:///usr/share/wallpapers/EnthronedVigilia/
PreviewImage=file:///usr/share/wallpapers/EnthronedVigilia/
