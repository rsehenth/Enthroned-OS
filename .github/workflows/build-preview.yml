---
name: Build preview image (no publish)

# F1 policy: manual builds only. Builds the OCI image on the runner (the build
# itself runs 'bootc container lint'), verifies it, and exports an OCI archive
# as a workflow artifact. There is NO registry login and NO push anywhere.
# Publishing stays blocked until ADR-0002 configuration is done by a human.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify OCI image
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned, inherited from upstream template)

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0 (SHA pinned, inherited from upstream template)

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # SHA pinned, inherited from upstream template

      - name: Build image (includes 'bootc container lint')
        run: just build

      - name: Verify image
        run: just verify-image

      - name: Export OCI archive
        run: |
          mkdir -p output
          sudo podman save --format oci-archive \
            -o "output/EnthronedOS-F1-dev.oci.tar" \
            "localhost/enthroned-os:f1-dev"
          sudo chown "$(id -u):$(id -g)" output/EnthronedOS-F1-dev.oci.tar

      - name: Record image identity
        run: |
          sudo podman image inspect localhost/enthroned-os:f1-dev |
            jq -r '.[0] | "ID: \(.Id)\nDigest: \(.Digest // "n/a")"' |
            tee output/image-digest.txt
          sudo podman image inspect ghcr.io/ublue-os/aurora:stable > output/aurora-base.json
          bash scripts/verify-artifacts.sh output/EnthronedOS-F1-dev.oci.tar

      - name: Upload OCI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (SHA pinned, inherited from upstream template)
        with:
          name: enthroned-os-f1-dev-oci
          path: output/
          if-no-files-found: error
          retention-days: 14
